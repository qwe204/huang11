services:
  nginx:
    image: nginx:1.24-alpine
    container_name: doc-preview-nginx
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./web-component/dist:/usr/share/nginx/html:ro
      - ./demo:/opt/demo:ro
      - doc-storage:/data/documents:ro
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - doc-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: doc-preview-server
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${SERVER_PORT:-3000}
      - STORAGE_PATH=${STORAGE_PATH:-/data/documents}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
      - ONLYOFFICE_URL=${ONLYOFFICE_URL:-http://host.docker.internal}
      - ONLYOFFICE_PUBLIC_URL=${ONLYOFFICE_PUBLIC_URL:-http://localhost}
      - ONLYOFFICE_JWT_ENABLED=${ONLYOFFICE_JWT_ENABLED:-true}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8088}
      - CALLBACK_HOST=${CALLBACK_HOST:-http://localhost:8088}
    volumes:
      - doc-storage:/data/documents
      - db-data:/data/db
    restart: unless-stopped
    networks:
      - doc-net

volumes:
  doc-storage:
  db-data:

networks:
  doc-net:
    driver: bridge
